name: Supabase keepalive

on:
  schedule:
    # Every two hours, offset from the top of the hour to reduce scheduler delay.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Insert Supabase heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            --request POST \
            --url "${SUPABASE_URL%/}/rest/v1/kin_keepalive" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{\"source\":\"github-actions\",\"heartbeat_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

          echo "Supabase keepalive inserted successfully."
